<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Security Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #0f0f1a;
            --blue-primary: #1a6dff;
            --blue-glow: #3b82f6;
            --blue-light: #60a5fa;
            --blue-dark: #0c1e3d;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --input-bg: #0d0d1a;
            --error: #ef4444;
            --success: #22c55e;
            --gradient-1: linear-gradient(135deg, #0f0f1a 0%, #0c1e3d 50%, #0a0a2e 100%);
            --gradient-2: linear-gradient(135deg, #1a6dff 0%, #3b82f6 50%, #60a5fa 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--blue-primary);
            opacity: 0;
            animation: floatUp 8s infinite ease-in;
        }
        .particle:nth-child(1) {
            width: 4px;
            height: 4px;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 7s;
        }
        .particle:nth-child(2) {
            width: 2px;
            height: 2px;
            left: 25%;
            animation-delay: 1.5s;
            animation-duration: 9s;
        }
        .particle:nth-child(3) {
            width: 5px;
            height: 5px;
            left: 40%;
            animation-delay: 3s;
            animation-duration: 6s;
        }
        .particle:nth-child(4) {
            width: 3px;
            height: 3px;
            left: 55%;
            animation-delay: 0.8s;
            animation-duration: 10s;
        }
        .particle:nth-child(5) {
            width: 4px;
            height: 4px;
            left: 70%;
            animation-delay: 2.2s;
            animation-duration: 8s;
        }
        .particle:nth-child(6) {
            width: 2px;
            height: 2px;
            left: 85%;
            animation-delay: 4s;
            animation-duration: 7.5s;
        }
        .particle:nth-child(7) {
            width: 6px;
            height: 6px;
            left: 15%;
            animation-delay: 5s;
            animation-duration: 11s;
        }
        .particle:nth-child(8) {
            width: 3px;
            height: 3px;
            left: 50%;
            animation-delay: 3.5s;
            animation-duration: 8.5s;
        }
        .particle:nth-child(9) {
            width: 4px;
            height: 4px;
            left: 75%;
            animation-delay: 1s;
            animation-duration: 9.5s;
        }
        .particle:nth-child(10) {
            width: 2px;
            height: 2px;
            left: 92%;
            animation-delay: 6s;
            animation-duration: 7s;
        }
        .particle:nth-child(11) {
            width: 5px;
            height: 5px;
            left: 32%;
            animation-delay: 4.5s;
            animation-duration: 10.5s;
        }
        .particle:nth-child(12) {
            width: 3px;
            height: 3px;
            left: 62%;
            animation-delay: 2.8s;
            animation-duration: 6.5s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            30% {
                opacity: 0.3;
            }
            60% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(26, 109, 255, 0.12);
            top: -100px;
            left: -80px;
            animation: orbFloat1 10s ease-in-out infinite;
        }
        .glow-orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(59, 130, 246, 0.1);
            bottom: -120px;
            right: -60px;
            animation: orbFloat2 12s ease-in-out infinite;
        }
        .glow-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(96, 165, 250, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 8s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, 30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, -20px) scale(0.9);
            }
        }
        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-30px, -25px) scale(1.15);
            }
            66% {
                transform: translate(25px, 20px) scale(0.85);
            }
        }
        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: linear-gradient(rgba(59, 130, 246, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.5) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ===== MAIN CARD ===== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 12px;
        }

        .auth-card {
            background: var(--gradient-1);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(26, 109, 255, 0.1) inset, 0 0 80px rgba(26, 109, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: visible;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(26, 109, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .auth-card>* {
            position: relative;
            z-index: 1;
        }

        /* ===== LOGO ===== */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--gradient-2);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 12px 35px rgba(26, 109, 255, 0.35);
            position: relative;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            background: var(--gradient-2);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            animation: logoPulse 2.5s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.08);
            }
        }
        .logo-icon i {
            font-size: 26px;
            color: #fff;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .brand-name span {
            color: var(--blue-light);
        }
        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 28px;
            gap: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--gradient-2);
            color: #fff;
            box-shadow: 0 6px 20px rgba(26, 109, 255, 0.35);
        }
        .tab-btn:not(.active):hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
        }
        .tab-btn i {
            margin-right: 4px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* --- FIXED INPUT WRAPPER --- */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding-left: 48px;   /* space for lock icon */
            padding-right: 60px;  /* space for eye icon */
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }
        .input-wrapper input:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 4px rgba(26, 109, 255, 0.1), 0 0 25px rgba(26, 109, 255, 0.08);
            background: #0f0f20;
        }

        /* Lock icon */
        .input-wrapper > i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
            z-index: 2;
            transition: color 0.3s;
        }
        .input-wrapper:has(input:focus) > i {
            color: var(--blue-light);
        }

        /* Eye toggle button — FIXED */
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            z-index: 10;
            padding: 0;
        }
        .toggle-password i {
            font-size: 16px;
            line-height: 1;
        }
        .toggle-password:hover {
            color: var(--text-secondary);
        }

        /* ===== SUBMIT ===== */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient-2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(26, 109, 255, 0.3);
        }
        .submit-btn:hover {
            box-shadow: 0 14px 40px rgba(26, 109, 255, 0.45);
            transform: translateY(-2px);
        }
        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 20px rgba(26, 109, 255, 0.3);
        }
        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            transition: all 0.6s;
            transform: translateX(-100%);
        }
        .submit-btn:hover::after {
            transform: translateX(100%);
        }
        .submit-btn i {
            margin-left: 8px;
            font-size: 13px;
            transition: transform 0.3s;
        }
        .submit-btn:hover i {
            transform: translateX(4px);
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 20px;
            gap: 14px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-text {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
            white-space: nowrap;
        }

        .info-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 0;
            letter-spacing: 0.2px;
        }
        .info-text i {
            color: var(--blue-light);
            margin: 0 4px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 24px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(26, 109, 255, 0.15);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
            pointer-events: none;
            opacity: 0;
            max-width: 92%;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(34, 197, 94, 0.2);
        }
        .toast.success i {
            color: var(--success);
        }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(239, 68, 68, 0.2);
        }
        .toast.error i {
            color: var(--error);
        }

        /* ===== EXPLOSION PARTICLES ===== */
        .explosion-particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 8px;
            height: 8px;
            background: var(--blue-light);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--blue-primary), 0 0 12px var(--blue-glow);
            animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            body {
                padding: 12px;
            }
            .auth-card {
                padding: 28px 20px;
                border-radius: 20px;
            }
            .logo-icon {
                width: 52px;
                height: 52px;
                border-radius: 14px;
            }
            .logo-icon i {
                font-size: 22px;
            }
            .brand-name {
                font-size: 19px;
            }
            .tab-btn {
                padding: 10px 12px;
                font-size: 13px;
            }
            .tab-btn i {
                margin-right: 2px;
            }
            .input-wrapper input {
                height: 46px;
                padding-left: 44px;
                padding-right: 56px;
                font-size: 14px;
            }
            .input-wrapper > i {
                left: 14px;
                font-size: 14px;
            }
            .toggle-password {
                right: 12px;
                width: 22px;
                height: 22px;
            }
            .toggle-password i {
                font-size: 15px;
            }
            .submit-btn {
                padding: 14px;
                font-size: 15px;
            }
            .divider {
                margin: 20px 0 16px;
                gap: 10px;
            }
            .divider-text {
                font-size: 11px;
            }
            .toast {
                top: 12px;
                padding: 12px 18px;
                font-size: 13px;
                max-width: 96%;
            }
        }

        @media (max-width: 380px) {
            .auth-card {
                padding: 20px 14px;
            }
            .tabs {
                flex-direction: column;
                gap: 4px;
            }
            .tab-btn {
                padding: 8px;
                font-size: 12px;
                text-align: center;
            }
            .input-wrapper input {
                height: 42px;
                padding-left: 40px;
                padding-right: 52px;
                font-size: 13px;
            }
            .input-wrapper > i {
                left: 12px;
                font-size: 13px;
            }
            .toggle-password {
                right: 10px;
                width: 20px;
                height: 20px;
            }
            .toggle-password i {
                font-size: 13px;
            }
            .brand-name {
                font-size: 17px;
            }
            .logo-icon {
                width: 44px;
                height: 44px;
                border-radius: 12px;
            }
            .logo-icon i {
                font-size: 18px;
            }
            .divider-text {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Background effects -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="bg-particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fa-solid" id="toastIcon"></i>
        <span id="toastMsg"></span>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="auth-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="brand-name">Best<span>Security</span></div>
                <div class="brand-subtitle">Enterprise-grade protection</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </div>

            <form id="authForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                        <button type="button" class="toggle-password" id="togglePasswordBtn" tabindex="-1" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" onclick="handleSubmit()">
                    <span id="submitText">Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">secured by firebase</span>
                <div class="divider-line"></div>
            </div>

            <p class="info-text">
                <i class="fa-solid fa-shield-check"></i> 256-bit encrypted connection
            </p>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDadBk35rrd0zna4f-885PskqIblgDLso0",
            authDomain: "best-security-login.firebaseapp.com",
            projectId: "best-security-login",
            storageBucket: "best-security-login.firebasestorage.app",
            messagingSenderId: "118938081656",
            appId: "1:118938081656:web:ea7dac8c3e3d419374508d",
            measurementId: "G-6ZJTQN70FL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.auth = auth;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;

        console.log('🔥 Firebase Auth initialized');
    </script>

    <!-- UI Logic -->
    <script>
        let currentMode = 'login';

        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const submitText = document.getElementById('submitText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMsg = document.getElementById('toastMsg');

        // ===== EXPLOSION EFFECT =====
        function createExplosion(x, y) {
            const colors = ['#60a5fa', '#3b82f6', '#1a6dff', '#ffffff', '#93c5fd'];
            for (let i = 0; i < 14; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                const angle = (i / 14) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                const distance = 25 + Math.random() * 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                const size = 5 + Math.random() * 9;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                document.body.appendChild(particle);
                particle.addEventListener('animationend', () => particle.remove());
            }
        }

        // ===== TOGGLE PASSWORD =====
        window.togglePassword = function(e) {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            const rect = togglePasswordBtn.getBoundingClientRect();
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
        };
        togglePasswordBtn.addEventListener('click', window.togglePassword);

        // ===== SWITCH TAB =====
        window.switchTab = function(mode) {
            currentMode = mode;
            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                submitText.textContent = 'Sign In';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                submitText.textContent = 'Create Account';
            }
            emailInput.value = '';
            passwordInput.value = '';
            passwordInput.type = 'password';
            toggleIcon.className = 'fa-solid fa-eye';
            emailInput.focus();
        };

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            toast.className = 'toast ' + type;
            toastMsg.textContent = message;
            if (type === 'success') toastIcon.className = 'fa-solid fa-circle-check';
            else if (type === 'error') toastIcon.className = 'fa-solid fa-circle-exclamation';
            else toastIcon.className = 'fa-solid fa-circle-info';
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ===== HANDLE SUBMIT =====
        window.handleSubmit = function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showToast('Please fill in all fields', 'error');
                if (!email) emailInput.focus();
                else passwordInput.focus();
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address', 'error');
                emailInput.focus();
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                passwordInput.focus();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitText.textContent;
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            submitBtn.style.pointerEvents = 'none';
            submitText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

            const tryAuth = () => {
                if (!window.auth || !window.signInWithEmailAndPassword || !window.createUserWithEmailAndPassword) {
                    setTimeout(tryAuth, 200);
                    return;
                }
                const authPromise = currentMode === 'login' ?
                    window.signInWithEmailAndPassword(window.auth, email, password) :
                    window.createUserWithEmailAndPassword(window.auth, email, password);

                authPromise.then(() => {
                    showToast(currentMode === 'register' ? '✅ Account created! Welcome!' :
                        '🔥 Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, currentMode === 'login' ? 800 : 1500);
                }).catch((err) => {
                    let message = err.message;
                    if (err.code === 'auth/email-already-in-use') message =
                        'Email already registered. Sign in instead.';
                    else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' ||
                        err.code === 'auth/user-not-found') message = 'Invalid email or password.';
                    else if (err.code === 'auth/weak-password') message =
                        'Password too weak. Use at least 6 characters.';
                    else if (err.code === 'auth/invalid-email') message = 'Invalid email format.';
                    else if (err.code === 'auth/too-many-requests') message =
                    'Too many attempts. Try again later.';
                    showToast(message, 'error');
                }).finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.pointerEvents = 'auto';
                    submitText.textContent = originalText;
                });
            };
            tryAuth();
        };

        // ===== KEYBOARD SHORTCUT =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (document.activeElement === emailInput || document.activeElement ===
                    passwordInput)) {
                e.preventDefault();
                handleSubmit();
            }
        });

        // ===== LOGOUT =====
        window.logout = function() {
            if (window.auth && window.signOut) {
                window.signOut(window.auth).then(() => {
                    showToast('👋 Logged out', 'info');
                    setTimeout(() => { window.location.href = 'index.html'; }, 800);
                }).catch(err => showToast(err.message, 'error'));
            }
        };

        emailInput.focus();
        console.log('🛡️ Best Security Login UI ready');
    </script>
</body>
</html>
